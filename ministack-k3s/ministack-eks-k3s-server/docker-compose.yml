
name: ministack

services:
  ministack:
    image: ministackorg/ministack:1.5.35
    container_name: ministack-eks-aws-api
    restart: unless-stopped

    ports:
      - "4566:4566"

    environment:
      GATEWAY_PORT: "4566"
      LOG_LEVEL: INFO
      DOCKER_NETWORK: ministack-net
      EKS_BASE_PORT: "16443"
      EKS_K3S_IMAGE: rancher/k3s:v1.31.4-k3s1
      MINISTACK_AUTOCREATE_AWS_MANAGED: "1"
      PERSIST_STATE: "1"
      STATE_DIR: /tmp/ministack-state

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/tmp/ministack-state

    networks:
      - ministack-net

networks:
  ministack-net:
    name: ministack-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1