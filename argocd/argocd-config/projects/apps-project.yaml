apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: apps
  namespace: argocd

spec:
  description: Application workloads

  sourceRepos:
    # Git Repo : Apps Workloads
    - ${{ git-repository }}

  destinations:
    - namespace: apps
      server: https://kubernetes.default.svc

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace